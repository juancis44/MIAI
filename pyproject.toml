[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miai-core"
version = "0.1.0"
description = "MIAI core utilities: configuration, logging, IO, exceptions, typing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Juan Cisneros" }
]
keywords = ["medical imaging", "deep learning", "reproducibility", "MONAI", "DICOM"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/juancis44/MIAI"
Issues = "https://github.com/juancis44/MIAI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/miai_core"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# UP017: prefer datetime.UTC alias. Skipped so timezone.utc keeps working
# identically on any Python >= 3.11 without relying on the newer alias.
ignore = ["UP017"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
