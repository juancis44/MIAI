[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymiai"
version = "0.16.0"
description = "MIAI: an open-source ecosystem for reproducible medical imaging workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Juan Cisneros" }
]
keywords = ["medical imaging", "deep learning", "reproducibility", "MONAI", "DICOM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pydicom>=2.4",
    "SimpleITK>=2.3",
    "numpy>=1.24",
    "torch>=2.2",
    "monai>=1.3",
    "scipy>=1.11",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "Pillow>=10.0",
    "onnx>=1.14",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "interrogate>=1.7",
    "pydocstyle>=6.3",
    # Not a MIAI runtime dependency -- pinned here to patch
    # PYSEC-2026-3447 in the setuptools version pip installs by
    # default into the dev/CI environment (surfaced by the pip-audit
    # security workflow, .github/workflows/security.yml).
    "setuptools>=83.0.0",
]

[project.scripts]
miai-pipeline = "miai_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/juancis44/MIAI"
Issues = "https://github.com/juancis44/MIAI/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "src/miai_core",
    "src/miai_dicom",
    "src/miai_pipeline",
    "src/miai_transforms",
    "src/miai_datasets",
    "src/miai_segmentation",
    "src/miai_evaluation",
    "src/miai_registration",
    "src/miai_diffusion",
    "src/miai_foundation_models",
    "src/miai_deploy",
    "src/miai_reconstruction",
    "src/miai_visualization",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# UP017: prefer datetime.UTC alias. Skipped so timezone.utc keeps working
# identically on any Python >= 3.11 without relying on the newer alias.
# N813: "import SimpleITK as sitk" is the library's own documented
# convention (used throughout its official docs/examples).
ignore = ["UP017", "N813"]

[tool.mypy]
# No python_version pin: let mypy infer it from whichever interpreter
# is running (matches the CI matrix's 3.11/3.12 jobs). Pinning it
# caused mypy to reject numpy's own 3.12-only stub syntax when run
# under Python 3.12 with a lower target version.
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SimpleITK ships no type stubs, so every call into it is "untyped"
# from mypy's point of view. Relax that specific strict check for the
# two modules that call SimpleITK directly, rather than repo-wide.
module = [
    "miai_pipeline.stages.dicom_to_nifti",
    "miai_pipeline.stages.preprocessing",
    "miai_pipeline.stages.registration",
    "miai_pipeline.stages.denoising",
    "miai_segmentation.three_d.infer",
    "miai_segmentation.two_d.infer",
    "miai_datasets.slices",
    "miai_transforms.sitk_transforms",
    "miai_evaluation.evaluate",
    "miai_registration.register",
    "miai_registration.apply",
    "miai_registration.transform_io",
    "miai_diffusion.denoise",
    "miai_foundation_models.run",
    "miai_reconstruction.run",
    "miai_pipeline.stages.visualization",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# MONAI ships partial/loose type stubs (many public APIs are typed
# Any), so strict's untyped-call/untyped-def checks fire throughout
# any module that calls into monai.* directly. Relax those specific
# checks for the modules that do so, rather than repo-wide.
module = [
    "miai_transforms.compose",
    "miai_transforms.sitk_transforms",
    "miai_datasets.loaders",
    "miai_segmentation.three_d.models",
    "miai_segmentation.three_d.train",
    "miai_segmentation.three_d.infer",
    "miai_segmentation.two_d.models",
    "miai_segmentation.two_d.infer",
    "miai_segmentation.two_half_d.models",
    "miai_evaluation.metrics",
    "miai_diffusion.train",
    "miai_pipeline.stages.training",
    "miai_pipeline.stages.inference",
    "miai_pipeline.stages.evaluation",
    "miai_pipeline.stages.diffusion_training",
    "miai_foundation_models.extractor",
    "miai_pipeline.stages.feature_extraction",
    "miai_pipeline.stages.export",
    "miai_deploy.export",
    "miai_reconstruction.kspace",
    "miai_reconstruction.metrics",
    "miai_visualization.slices",
    "miai_visualization.comparison",
    "miai_visualization.curves",
    "miai_visualization.metrics",
    "miai_visualization.embeddings",
    "test_deploy_export",
    "test_segmentation_three_d_train",
]
disallow_untyped_calls = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# monai's submodules (monai.transforms, monai.data, monai.losses, ...)
# import their public names into each __init__.py without listing them
# in __all__, which mypy strict's implicit-reexport check treats as
# "not actually exported" by default (attr-defined errors on every
# import from monai). Relax that specific check for monai itself,
# rather than adding a type: ignore to every import site.
module = "monai.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# transformers exposes most of its public API (AutoModel, AutoImageProcessor,
# and model call/attribute access) as Any-typed, same rationale as the monai
# override above.
module = "transformers.*"
implicit_reexport = true

[[tool.mypy.overrides]]
# Test-only modules that call SimpleITK directly (building synthetic
# volumes/DICOM series, asserting on written-out image geometry), same
# rationale as the src-side SimpleITK override above: SimpleITK ships
# no type stubs, so every call into it is "untyped" from mypy's
# strict point of view. Module names here are bare filenames (no
# "tests." prefix) because tests/ has no __init__.py, so mypy treats
# each test file as its own top-level module.
module = [
    "conftest",
    "test_pipeline_preprocessing",
    "test_pipeline_dicom_to_nifti",
    "test_registration_apply",
    "test_registration_transform_io",
    "test_diffusion_denoise",
    "test_segmentation_three_d_infer",
    "test_registration_register",
    "test_pipeline_two_d_modality",
    "test_segmentation_two_d_infer",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=95"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.interrogate]
# Enforces docs/api_design.md's "Documentation contract": every public
# function/class should have a (Google-style) docstring. Presence only --
# interrogate doesn't check that Args/Returns/Raises sections are complete,
# just that a docstring exists.
style = "google"
fail-under = 85
exclude = ["tests", "examples", "scripts"]
verbose = 1

[tool.pydocstyle]
# Deepens interrogate's presence-only check (above) to verify docstring
# *completeness* -- e.g. that a documented function's docstring is
# well-formed, not just that one exists. Convention "google" matches
# docs/coding_standards.md and interrogate's style="google". Scoped to
# src/ only, mirroring interrogate's tests/examples/scripts exclusion.
convention = "google"
match_dir = "^(?!tests|examples|scripts|locks|docs)[^.].*"
