version: 2
updates:
  # Root pyproject.toml -- covers every MIAI package, since this is a
  # single monorepo with one shared dependency set (see
  # docs/architecture.md, "Repository strategy").
  - package-ecosystem: "pip"
    directory: "/"
    # Non-recursive: only scans "/" itself, not subdirectories. This is why
    # locks/requirements-lock.txt lives under locks/ rather than the repo
    # root -- Dependabot auto-discovers any requirements*.txt-shaped file at
    # the scanned directory and manages it independently, which caused a
    # flood of failing PRs bumping single transitive/CUDA pins inside the
    # lockfile before the move (see docs/coding_standards.md, "Lockfile").
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  # Keep the CI workflow's own actions (actions/checkout,
  # actions/setup-python, ...) current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
