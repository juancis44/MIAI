name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: locks/requirements-lock.txt

      - name: Install package
        # locks/requirements-lock.txt pins every dependency (direct and
        # transitive) to an exact version for fully reproducible installs --
        # see docs/coding_standards.md on regenerating it. It lives under
        # locks/ rather than the repo root specifically so Dependabot's pip
        # ecosystem (directory: "/", non-recursive) doesn't discover it as a
        # manageable requirements file and try to bump individual transitive
        # pins one PR at a time (which happened when it lived at the root --
        # see CHANGELOG). The package itself is installed separately,
        # --no-deps, so pip doesn't re-resolve against pyproject.toml's
        # looser lower bounds.
        run: |
          pip install -r locks/requirements-lock.txt
          pip install -e . --no-deps

      - name: Check formatting (Black)
        run: black --check .

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src tests

      - name: Docstring completeness (interrogate)
        run: interrogate src

      - name: Run tests
        run: pytest
