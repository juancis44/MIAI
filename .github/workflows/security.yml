name: Security

on:
  schedule:
    # Every Monday at 06:00 UTC, independent of Dependabot's own weekly
    # schedule -- this catches newly-disclosed vulnerabilities in
    # already-pinned versions, which a dependency-version bump alone
    # wouldn't.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit installed dependencies
        run: pip-audit
